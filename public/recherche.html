<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        if (localStorage.getItem('theme') === 'sombre') {
            document.documentElement.setAttribute('data-theme', 'sombre');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rechercher une carte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🔍 Rechercher une carte</h1>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="collection.html">Ma collection</a>
            <a href="profil.html">Profil</a>
            <button id="btn-deconnexion" type="button">Déconnexion</button>
        </nav>
    </header>

    <a href="collection.html" id="btn-retour-collection">&larr; Retour à ma collection</a>

    <div id="zone-recherche">
        <section id="recherche">
            <input type="text" id="recherche-extension-filtre" placeholder="🔍 Filtrer les extensions...">
        </section>

        <div id="extensions-vignettes"></div>

        <div id="ajout-masse">
            <h3>Ajout rapide par numéros</h3>
            <div class="ajout-masse-ligne">
                <input type="text" id="numeros-a-ajouter" placeholder="Numéros séparés par une virgule (ex: 14, 6, 19)">
                <button type="button" id="btn-ajout-masse">Ajouter ces numéros</button>
            </div>
            <p id="message-ajout-masse"></p>
        </div>

        <input type="text" id="recherche-nom-carte" placeholder="🔎 Filtrer par nom de carte...">

        <div id="resultats-recherche"></div>
    </div>

    <div id="modal-ajout-carte" class="modal-overlay" hidden>
        <div class="modal-contenu">
            <button id="modal-fermer" class="modal-fermer" type="button">&times;</button>
            <img id="modal-image" src="" alt="">
            <h3 id="modal-nom"></h3>
            <p id="modal-info"></p>
            <label for="modal-quantite">Quantité</label>
            <input type="number" id="modal-quantite" min="1" value="1">
            <button type="button" id="modal-foil-toggle" class="toggle-carte" data-foil="false">
                <span class="toggle-texte">Normal</span>
                <span class="toggle-knob"></span>
            </button>
            <p id="modal-prix"></p>
            <button id="modal-confirmer" type="button">Ajouter à ma collection</button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="recherche.js"></script>
</body>
</html>
